<!DOCTYPE html>
<html lang="hu">
	<head>
		<meta charset="UTF-8" />
		<title>🎥 Legyen Ön is Milliomos! Multi - koncepció leírása</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
    :root {
      --accent: #ff6600;     /* narancssárga */
      --highlight: #00cc66;  /* zöld */
      --glow: #ffffff;
      --bg-gradient: radial-gradient(circle at center, #000010, #000000);
      --correct: #00cc66;
      --marked: #ff6600;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      background: var(--bg-gradient);
      color: #f0f0f0;
      min-height: 100vh;
      overflow-y: auto;
      padding: 2rem;
      transition: background 1s ease;
    }

    .glass-panel {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
      box-shadow: 0 0 20px var(--highlight);
      animation: fadeIn 1s ease-out;
    }

    h1, h2, h3 {
      color: var(--accent);
      text-shadow: 0 0 6px var(--accent);
      transition: all 0.3s ease;
      cursor: default;
    }

    h1:hover, h2:hover, h3:hover {
      text-shadow: 0 0 12px var(--accent), 0 0 24px var(--accent);
      transform: scale(1.03);
    }

    strong {
      color: var(--highlight);
      text-shadow: 0 0 4px var(--highlight);
      transition: all 0.3s ease;
      cursor: default;
    }

    strong:hover {
      text-shadow: 0 0 10px var(--highlight), 0 0 20px var(--highlight);
      transform: scale(1.05);
    }

    em {
      color: var(--glow);
      font-style: italic;
      text-shadow: 0 0 4px var(--glow);
      transition: all 0.3s ease;
      cursor: default;
    }

    em:hover {
      text-shadow: 0 0 10px var(--glow), 0 0 20px var(--glow);
      transform: scale(1.05);
    }

    hr {
      border: none;
      border-top: 2px solid var(--accent);
      margin: 2rem 0;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 1rem;
    }

    th, td {
      border: 1px solid #fff;
      padding: 0.5rem;
      text-align: center;
      color: #fff;
    }

    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 1rem;
    }

	ul ul {
      list-style: circle;
      margin-left: 1.5rem;
    }

    ul ul ul {
      list-style: square;
      margin-left: 3rem;
    }

    li {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--highlight);
      padding: 0.5rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      box-shadow: inset 0 0 5px var(--highlight);
    }

    .correct-answer {
      background-color: var(--correct);
      color: #fff;
      font-weight: bold;
      box-shadow: 0 0 10px var(--correct);
    }

    .marked-answer {
      background-color: var(--marked);
      color: #fff;
      font-weight: bold;
      box-shadow: 0 0 10px var(--marked);
    }

    .mode-toggle {
      display: flex;
      justify-content: center;
      margin: 2rem auto;
    }

    .mode-button {
      background: linear-gradient(to bottom, #222, #000);
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      text-shadow: 0 0 5px var(--accent);
      box-shadow: 0 0 10px var(--highlight);
      transition: all 0.3s ease;
    }

    .mode-button:hover {
      background: linear-gradient(to bottom, #333, #111);
      box-shadow: 0 0 20px var(--highlight);
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }


  </style>
	</head>
	<body>
		<div class="mode-toggle">
			<button class="mode-button" onclick="toggleMode()">🎛
				Módváltás</button>
		</div>
		<div class="glass-panel" id="markdown-output">Betöltés...</div>

		<script>
    async function loadMarkdown() {
  const response = await fetch('https://raw.githubusercontent.com/MassiveAwareness/placeholder/primary/content.md');
  const markdown = await response.text();
  const html = parseMarkdown(markdown);
  document.getElementById('markdown-output').innerHTML = html;
}

function parseMarkdown(md) {
  const lines = md.split('\n');
  let html = '';
  let listStack = [];
  let inTable = false;

  for (let line of lines) {
    const indentMatch = line.match(/^(\s*)- (.*)/);
    if (indentMatch) {
      const indent = indentMatch[1].length;
      const content = indentMatch[2]
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>');

      while (listStack.length > 0 && listStack[listStack.length - 1] > indent) {
        html += '</ul>';
        listStack.pop();
      }

      if (listStack.length === 0 || listStack[listStack.length - 1] < indent) {
        html += '<ul>';
        listStack.push(indent);
      }

      html += `<li>${content}</li>`;
      continue;
    }

    while (listStack.length > 0) {
      html += '</ul>';
      listStack.pop();
    }

    if (/^### /.test(line)) {
      html += `<h3>${line.slice(4)}</h3>`;
    } else if (/^## /.test(line)) {
      html += `<h2>${line.slice(3)}</h2>`;
    } else if (/^# /.test(line)) {
      html += `<h1>${line.slice(2)}</h1>`;
    } else if (/^---+$/.test(line.trim())) {
      html += `<hr>`;
    } else if (/^> /.test(line)) {
      const quoted = line.slice(2)
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>');
      html += `<blockquote>${quoted}</blockquote>`;
    } else if (/^\|(.+)\|$/.test(line.trim())) {
      const cells = line.trim().split('|').slice(1, -1).map(cell => cell.trim());
      const tag = line.includes('---') ? 'th' : 'td';
      if (!inTable) {
        html += '<table>';
        inTable = true;
      }
      html += `<tr>${cells.map(c => `<${tag}>${c}</${tag}>`).join('')}</tr>`;
    } else {
      if (inTable) {
        html += '</table>';
        inTable = false;
      }
      const formatted = line
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>');
      html += `<p>${formatted}</p>`;
    }
  }

  while (listStack.length > 0) {
    html += '</ul>';
    listStack.pop();
  }
  if (inTable) html += '</table>';
  return html;
}

function toggleMode() {
  const root = document.documentElement;
  const body = document.body;

  if (body.classList.contains('mode-flipped')) {
    body.classList.remove('mode-flipped');
    root.style.setProperty('--correct', '#00cc66');
    root.style.setProperty('--marked', '#ff6600');
    root.style.setProperty('--accent', '#ff6600');
    root.style.setProperty('--highlight', '#00cc66');
  } else {
    body.classList.add('mode-flipped');
    root.style.setProperty('--correct', '#ff6600');
    root.style.setProperty('--marked', '#00cc66');
    root.style.setProperty('--accent', '#00cc66');
    root.style.setProperty('--highlight', '#ff6600');
  }
}

window.addEventListener('DOMContentLoaded', loadMarkdown);

  </script>
	</body>
</html>
